<!-- SCHEMA 2: FAQPage (crítico para AEO — Google AI Overviews y featured snippets) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Does BetterSEO work with Commerce7?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. BetterSEO is designed specifically for Commerce7. It connects via your Tenant ID, automatically syncs your entire product catalog, and generates the corresponding SEO pages — no manual configuration required per product."
      }
    },
    {
      "@type": "Question",
      "name": "Does BetterSEO work with eCellar?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. BetterSEO supports eCellar using your API key. The sync and metadata generation process is the same as with Commerce7."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need coding knowledge to install BetterSEO?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. BetterSEO is a standard WordPress plugin. Install it from the WordPress admin dashboard, enter your Commerce7 or eCellar credentials, and the plugin handles everything automatically. If you prefer, Gorilion's team can handle the setup for a one-time fee of $199."
      }
    },
    {
      "@type": "Question",
      "name": "Is BetterSEO compatible with Rank Math and Yoast SEO?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. BetterSEO is compatible with both Rank Math and Yoast SEO. It detects which plugin you have active and works alongside it, disabling only the modules that would conflict with product pages to avoid duplicate metadata."
      }
    },
    {
      "@type": "Question",
      "name": "What is Open Graph and why does it matter for my winery?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Open Graph is the protocol that defines how your content looks when someone shares a link on social media, WhatsApp, iMessage, or Slack. Without Open Graph, the link appears as plain text. With Open Graph, it shows the wine image, name, and description — significantly improving click-through rate and brand perception."
      }
    },
    {
      "@type": "Question",
      "name": "How does BetterSEO help wineries appear in AI engine results like ChatGPT and Perplexity?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "AI engines like Google AI Overviews, ChatGPT (SearchGPT), Perplexity, and Claude answer questions like 'what is the best Pinot Noir in Sonoma' using pages with properly structured data. BetterSEO generates Schema.org Product markup, complete product attributes, and semantic relationships between varietal, vintage, region, and price — exactly what AI crawlers need to include your wines in their answers."
      }
    },
    {
      "@type": "Question",
      "name": "How often does BetterSEO sync my wine catalog?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "BetterSEO automatically syncs your catalog at regular intervals. You can also trigger a manual sync from the WordPress admin panel whenever needed — for example, when launching a new vintage or updating prices."
      }
    },
    {
      "@type": "Question",
      "name": "How much does BetterSEO cost?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "BetterSEO is $30 per month with no contract. A one-time professional setup by the Gorilion team is available for $199, which includes installation, configuration, metadata review, and product feed activation."
      }
    },
    {
      "@type": "Question",
      "name": "Can I cancel BetterSEO at any time?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. There are no long-term contracts. You can cancel your subscription at any time from your client dashboard."
      }
    },
    {
      "@type": "Question",
      "name": "What e-commerce platforms does BetterSEO support?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "BetterSEO currently supports Commerce7 and eCellar, the two most widely used e-commerce platforms for wineries in the United States. Support for additional platforms is on our roadmap."
      }
    }
  ]
}
</script>
