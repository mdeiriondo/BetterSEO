name: Deploy Landing to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'landing/**'   # solo si cambia algo en la carpeta landing/

  workflow_dispatch:    # permite trigger manual desde GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to betterseo.pages.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        working-directory: landing
        run: npm install

      - name: Build
        working-directory: landing
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=betterseo --branch=main
          workingDirectory: landing
